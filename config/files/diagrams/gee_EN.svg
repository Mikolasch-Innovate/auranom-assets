<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="2300" viewBox="-100 -100 1500 2400" xmlns="http://www.w3.org/2000/svg" version="1.1">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1565c0"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#c2185b"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#388e3c"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#f57c00"/>
    </marker>
  </defs>
  <!-- White background -->
  <rect x="-100" y="-100" width="1500" height="2400" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="700" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">G-EE/ARGUS Interface Diagram V17</text>
  <text x="700" y="55" font-size="16" text-anchor="middle" fill="#666">E2: AGENTS GOVERNANCE - 10 Services (incl. Input Guard)</text>
  
  <!-- E0: EXECUTIVE -->
  <rect x="50" y="80" width="500" height="60" fill="#fff3e0" stroke="#ff6f00" stroke-width="2" rx="6"/>
  <text x="300" y="105" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">E0: EXECUTIVE</text>
  <text x="300" y="125" font-size="12" text-anchor="middle" fill="#555">Strategic decisions + Escalation</text>
  
  <!-- E1: SYSTEM & PROZESSE GOVERNANCE -->
  <rect x="50" y="160" width="500" height="60" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="6"/>
  <text x="300" y="185" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">E1: SYSTEM &amp; PROCESSES GOVERNANCE</text>
  <text x="300" y="205" font-size="12" text-anchor="middle" fill="#555">Compliance + Process Standards</text>
  
  <!-- E2: AGENTS GOVERNANCE (G-EE/ARGUS) - ZENTRAL -->
  <rect x="50" y="240" width="900" height="480" fill="#fce4ec" stroke="#c2185b" stroke-width="4" rx="8"/>
  <text x="500" y="270" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">E2: AGENTS GOVERNANCE (G-EE/ARGUS)</text>
  <text x="500" y="295" font-size="14" text-anchor="middle" fill="#555">Meta-Ebene: Monitors Agent Behaviour + User-Inputs</text>
  
  <!-- 10 Services innerhalb E2 -->
  <rect x="70" y="310" width="860" height="390" fill="#f8bbd0" stroke="#c2185b" stroke-width="2" rx="6"/>
  <text x="500" y="335" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">10 Services</text>
  
  <!-- Service Grid (3x3) -->
  <rect x="90" y="350" width="270" height="50" fill="#fff" stroke="#c2185b" stroke-width="1" rx="4"/>
  <text x="225" y="380" font-size="12" text-anchor="middle" fill="#333">1. Loop-Detection</text>
  
  <rect x="375" y="350" width="270" height="50" fill="#fff" stroke="#c2185b" stroke-width="1" rx="4"/>
  <text x="510" y="380" font-size="12" text-anchor="middle" fill="#333">2. Confidence-Management</text>
  
  <rect x="660" y="350" width="260" height="50" fill="#fff" stroke="#c2185b" stroke-width="1" rx="4"/>
  <text x="790" y="380" font-size="12" text-anchor="middle" fill="#333">3. Reward Hacking Detection</text>
  
  <rect x="90" y="415" width="270" height="50" fill="#fff" stroke="#c2185b" stroke-width="1" rx="4"/>
  <text x="225" y="445" font-size="12" text-anchor="middle" fill="#333">4. Reasoning Quality Check</text>
  
  <rect x="375" y="415" width="270" height="50" fill="#fff" stroke="#c2185b" stroke-width="1" rx="4"/>
  <text x="510" y="445" font-size="12" text-anchor="middle" fill="#333">5. Diversity Check</text>
  
  <rect x="660" y="415" width="260" height="50" fill="#fff" stroke="#c2185b" stroke-width="1" rx="4"/>
  <text x="790" y="445" font-size="12" text-anchor="middle" fill="#333">6. Sycophancy-Detection</text>
  
  <rect x="90" y="480" width="270" height="50" fill="#fff" stroke="#c2185b" stroke-width="1" rx="4"/>
  <text x="225" y="510" font-size="12" text-anchor="middle" fill="#333">7. Positive Reinforcement</text>
  
  <rect x="375" y="480" width="270" height="50" fill="#fff" stroke="#c2185b" stroke-width="1" rx="4"/>
  <text x="510" y="510" font-size="12" text-anchor="middle" fill="#333">8. Client Feedback Detection</text>
  
  <rect x="660" y="480" width="260" height="50" fill="#fff" stroke="#c2185b" stroke-width="1" rx="4"/>
  <text x="790" y="510" font-size="12" text-anchor="middle" fill="#333">9. Grounding Check</text>
  
  <!-- Service 10 (Input Guard) - hervorgehoben -->
  <rect x="90" y="545" width="830" height="70" fill="#ffebee" stroke="#d32f2f" stroke-width="2" rx="4"/>
  <text x="505" y="570" font-size="14" font-weight="bold" text-anchor="middle" fill="#d32f2f">10. Input Guard (E12 → User Input Validation)</text>
  <text x="505" y="590" font-size="11" text-anchor="middle" fill="#555">Content Moderation • Prompt Injection • Jailbreak Detection • Data Access Validation</text>
  <text x="505" y="605" font-size="10" text-anchor="middle" fill="#555">Integration: LANA (E12) → Input Guard → Validation → E11</text>
  
  <!-- Output Channels -->
  <text x="500" y="645" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Output:</text>
  <text x="500" y="665" font-size="11" text-anchor="middle" fill="#555">Quality Approval (OK/FAIL) • Escalation • Corrections</text>
  <text x="500" y="685" font-size="11" text-anchor="middle" fill="#555">Error Log • Audit Trail • Input Blocking</text>
  
  <!-- E3-E7: PROZESS-ORCHESTRIERUNG -->
  <rect x="50" y="740" width="500" height="100" fill="#fff9c4" stroke="#f57f17" stroke-width="2" rx="6"/>
  <text x="300" y="765" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">E3-E7: PROZESS-ORCHESTRIERUNG</text>
  <text x="300" y="785" font-size="12" text-anchor="middle" fill="#555">E3: Dual-Process</text>
  <text x="300" y="800" font-size="12" text-anchor="middle" fill="#555">E4: Phases • E5: Milestones</text>
  <text x="300" y="815" font-size="12" text-anchor="middle" fill="#555">E6: Steps • E7: Event Design</text>
  
  <!-- E8-E9: BERATUNGS-METHODIK -->
  <rect x="50" y="860" width="500" height="80" fill="#e1bee7" stroke="#7b1fa2" stroke-width="2" rx="6"/>
  <text x="300" y="885" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">E8-E9: BERATUNGS-METHODIK</text>
  <text x="300" y="905" font-size="12" text-anchor="middle" fill="#555">E8: Consulting Methodology</text>
  <text x="300" y="925" font-size="12" text-anchor="middle" fill="#555">E9: Design Elements</text>
  
  <!-- E10-E11: TASK-MANAGEMENT -->
  <rect x="50" y="960" width="500" height="80" fill="#c8e6c9" stroke="#388e3c" stroke-width="2" rx="6"/>
  <text x="300" y="985" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">E10-E11: TASK-MANAGEMENT</text>
  <text x="300" y="1005" font-size="12" text-anchor="middle" fill="#555">E10: Tasks (Status Tracking)</text>
  <text x="300" y="1025" font-size="12" text-anchor="middle" fill="#555">E11: Execution &amp; QC</text>
  
  <!-- E12: CLIENT INTERACTION -->
  <rect x="50" y="1060" width="500" height="60" fill="#b2dfdb" stroke="#00796b" stroke-width="2" rx="6"/>
  <text x="300" y="1085" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">E12: CLIENT INTERACTION</text>
  <text x="300" y="1105" font-size="12" text-anchor="middle" fill="#555">STT, Pres, WB, TTS, CRM, PM, Analytics, Avatar</text>
  
  <!-- Event-Protokoll (25px rechts neben Ebenen, Höhe E3-E12) -->
  <rect x="655" y="740" width="300" height="380" fill="#e8f5e9" stroke="#388e3c" stroke-width="3" rx="6"/>
  <text x="805" y="770" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Event-Protokoll</text>
  <text x="805" y="795" font-size="13" text-anchor="middle" fill="#555">Logs Agent Actions</text>
  <line x1="670" y1="810" x2="940" y2="810" stroke="#388e3c" stroke-width="1"/>
  
  <text x="805" y="835" font-size="12" text-anchor="middle" fill="#555">• E3-E7: Process Decisions</text>
  <text x="805" y="855" font-size="12" text-anchor="middle" fill="#555">  (PM model, Phases, Milestones)</text>
  
  <text x="805" y="885" font-size="12" text-anchor="middle" fill="#555">• E8-E9: Consulting Methodology</text>
  <text x="805" y="905" font-size="12" text-anchor="middle" fill="#555">  (Methodology selection, Design Elements)</text>
  
  <text x="805" y="935" font-size="12" text-anchor="middle" fill="#555">• E10: Tasks</text>
  <text x="805" y="955" font-size="12" text-anchor="middle" fill="#555">  (Status changes, Assignments)</text>
  
  <text x="805" y="985" font-size="12" text-anchor="middle" fill="#555">• E11: Execution &amp; QC</text>
  <text x="805" y="1005" font-size="12" text-anchor="middle" fill="#555">  (Deliverables, Quality Checks)</text>
  
  <text x="805" y="1035" font-size="12" text-anchor="middle" fill="#555">• E12: Client Interaction</text>
  <text x="805" y="1055" font-size="12" text-anchor="middle" fill="#555">  (STT, TTS, CRM, PM Updates)</text>
  
  <line x1="670" y1="1075" x2="940" y2="1075" stroke="#388e3c" stroke-width="1"/>
  <text x="805" y="1100" font-size="11" text-anchor="middle" fill="#555" font-style="italic">Complete Audit Trail</text>
  
  <!-- Error log (above E2, right of E0-E1) -->
  <rect x="655" y="80" width="300" height="140" fill="#ffebee" stroke="#d32f2f" stroke-width="3" rx="6"/>
  <text x="805" y="110" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Error Log</text>
  <text x="805" y="135" font-size="13" text-anchor="middle" fill="#555">Dokumentation aller Probleme</text>
  <text x="805" y="160" font-size="12" text-anchor="middle" fill="#555">• Governance Error (G-EE)</text>
  <text x="805" y="180" font-size="12" text-anchor="middle" fill="#555">• Compliance Error (Veritas)</text>
  <text x="805" y="200" font-size="12" text-anchor="middle" fill="#555">• Critical issues</text>
  
  <!-- ACHP (right, centre) -->
  <rect x="1040" y="240" width="150" height="60" fill="#fff3e0" stroke="#f57c00" stroke-width="3" rx="6"/>
  <text x="1115" y="275" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">ACHP</text>
  
  <!-- LANA (E12) - Input Guard -->
  <rect x="1040" y="320" width="150" height="80" fill="#ffebee" stroke="#d32f2f" stroke-width="3" rx="6"/>
  <text x="1115" y="350" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">LANA</text>
  <text x="1115" y="370" font-size="11" text-anchor="middle" fill="#555">(E12)</text>
  <text x="1115" y="390" font-size="10" text-anchor="middle" fill="#555">Input Guard</text>
  
  <!-- PPLS - Data Access Validation -->
  <rect x="1040" y="420" width="150" height="80" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" rx="6"/>
  <text x="1115" y="450" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">PPLS</text>
  <text x="1115" y="470" font-size="10" text-anchor="middle" fill="#555">Data Access</text>
  <text x="1115" y="490" font-size="10" text-anchor="middle" fill="#555">Validation</text>
  
  <!-- ISMS (ISO 27001) -->
  <rect x="1040" y="520" width="150" height="80" fill="#e8f5e9" stroke="#388e3c" stroke-width="3" rx="6"/>
  <text x="1115" y="550" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">ISMS</text>
  <text x="1115" y="570" font-size="10" text-anchor="middle" fill="#555">ISO 27001</text>
  <text x="1115" y="590" font-size="10" text-anchor="middle" fill="#555">Kontrollen</text>
  
  <!-- Arrows: E3-E7 → Event Log -->
  <line x1="550" y1="790" x2="655" y2="790" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  
  <!-- Arrows: E8-E9 → Event Log -->
  <line x1="550" y1="900" x2="655" y2="900" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  
  <!-- Arrows: E10-E11 → Event Log -->
  <line x1="550" y1="1000" x2="655" y2="1000" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  
  <!-- Arrows: E12 → Event Log -->
  <line x1="550" y1="1090" x2="655" y2="1090" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  
  <!-- Arrow: Event Log → E2 (upward) -->
  <line x1="805" y1="740" x2="805" y2="720" stroke="#388e3c" stroke-width="3" marker-end="url(#arrowhead-green)"/>
  <text x="750" y="730" font-size="11" fill="#388e3c" font-weight="bold">Audit-Trail</text>
  
  <!-- Arrows: ACHP ↔ E2 -->
  <line x1="1040" y1="270" x2="950" y2="270" stroke="#f57c00" stroke-width="3" marker-end="url(#arrowhead-orange)"/>
  <text x="985" y="265" font-size="10" fill="#f57c00" font-weight="bold">Kontext-Paket</text>
  
  <line x1="950" y1="280" x2="1040" y2="280" stroke="#388e3c" stroke-width="3" marker-end="url(#arrowhead-green)"/>
  <text x="985" y="295" font-size="10" fill="#388e3c" font-weight="bold">OK/FAIL</text>
  
  <!-- Arrows: LANA ↔ E2 (Input Guard) -->
  <line x1="1040" y1="360" x2="950" y2="360" stroke="#d32f2f" stroke-width="3" marker-end="url(#arrowhead-red)"/>
  <text x="985" y="355" font-size="10" fill="#d32f2f" font-weight="bold">User Input</text>
  
  <line x1="950" y1="370" x2="1040" y2="370" stroke="#388e3c" stroke-width="3" marker-end="url(#arrowhead-green)"/>
  <text x="985" y="385" font-size="10" fill="#388e3c" font-weight="bold">Validated/Blocked</text>
  
  <!-- Arrows: PPLS ↔ E2 (Data Access) -->
  <line x1="1040" y1="460" x2="950" y2="460" stroke="#1565c0" stroke-width="3" marker-end="url(#arrowhead-blue)"/>
  <text x="985" y="455" font-size="10" fill="#1565c0" font-weight="bold">Data Request</text>
  
  <line x1="950" y1="470" x2="1040" y2="470" stroke="#388e3c" stroke-width="3" marker-end="url(#arrowhead-green)"/>
  <text x="985" y="485" font-size="10" fill="#388e3c" font-weight="bold">Anonymized Data</text>
  
  <!-- Arrows: ISMS ↔ E2 (Controls) -->
  <line x1="1040" y1="560" x2="950" y2="560" stroke="#388e3c" stroke-width="3" marker-end="url(#arrowhead-green)"/>
  <text x="985" y="555" font-size="10" fill="#388e3c" font-weight="bold">Compliance Rules</text>
  
  <line x1="950" y1="570" x2="1040" y2="570" stroke="#388e3c" stroke-width="3" marker-end="url(#arrowhead-green)"/>
  <text x="985" y="585" font-size="10" fill="#388e3c" font-weight="bold">Audit Reports</text>
  
  <!-- Arrows: E2 → Error log -->
  <line x1="805" y1="240" x2="805" y2="220" stroke="#d32f2f" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  
  <!-- Arrows: Error log → E0 (Escalation) -->
  <line x1="655" y1="110" x2="550" y2="110" stroke="#d32f2f" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#arrowhead-red)"/>
  <text x="560" y="105" font-size="11" fill="#d32f2f" font-weight="bold">Eskalation</text>
  
  <!-- Arrows: Error log → E1 (Escalation) -->
  <line x1="655" y1="190" x2="550" y2="190" stroke="#d32f2f" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#arrowhead-red)"/>
  <text x="560" y="185" font-size="11" fill="#d32f2f" font-weight="bold">Eskalation</text>
  
  <!-- Legend -->
  <rect x="50" y="1180" width="900" height="150" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="6"/>
  <text x="500" y="1210" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Legend: Data Flow</text>
  
  
  <line x1="100" y1="1270" x2="200" y2="1270" stroke="#388e3c" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowhead-green)"/>
  <line x1="100" y1="1300" x2="200" y2="1300" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="220" y="1305" font-size="12" fill="#333">Layers → Event Log: Log actions</text>
  
  <line x1="100" y1="1240" x2="200" y2="1240" stroke="#388e3c" stroke-width="3" marker-end="url(#arrowhead-green)"/>
  <text x="220" y="1245" font-size="12" fill="#333">Event Log → E2: Provide Audit Trail</text>
  
  <line x1="100" y1="1270" x2="200" y2="1270" stroke="#f57c00" stroke-width="3" marker-end="url(#arrowhead-orange)"/>
  <text x="220" y="1275" font-size="12" fill="#333">ACHP → E2: Context Package for verification</text>
  
  <line x1="100" y1="1300" x2="200" y2="1300" stroke="#d32f2f" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-red)"/>
  <text x="220" y="1305" font-size="12" fill="#333">E2 → Error Log → E0/E1: Escalation</text>
  
</svg>
