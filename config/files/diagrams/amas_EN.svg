<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 2000 1700" width="2000" height="1700">
  <!-- White background -->
  <rect x="-100" y="-100" width="2000" height="1700" fill="white"/>
  
  <!-- Title -->
  <text x="900" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    AMAS - Autonomous Multi-Agent System
  </text>
  <text x="900" y="85" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#666">
    13-Layer Hierarchy (E0-E12) | DPO + Autonomy | 5 ISO Standards
  </text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1976d2" />
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#388e3c" />
    </marker>
    <marker id="arroworange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f57c00" />
    </marker>
    <marker id="arrowpurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7b1fa2" />
    </marker>
    <marker id="arrowpink" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c2185b" />
    </marker>
    <marker id="arrowgray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#999" />
    </marker>
  </defs>

  <!-- Left: E-Layer Hierarchy -->
  <text x="50" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">
    E-Layer Hierarchy
  </text>

  <!-- E0: Human Governance -->
  <rect x="50" y="180" width="400" height="70" fill="#ffebee" stroke="#d32f2f" stroke-width="3" rx="8"/>
  <text x="250" y="210" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#d32f2f">
    E0: Human Governance
  </text>
  <text x="250" y="235" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">
    Strategic decisions, Escalation
  </text>

  <!-- E1: System & Prozesse Governance Agent -->
  <rect x="50" y="270" width="400" height="90" fill="#e8f5e9" stroke="#388e3c" stroke-width="3" rx="8"/>
  <text x="250" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#388e3c">
    E1: System &amp; Prozesse Governance Agent
  </text>
  <text x="250" y="325" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
    Compliance, Process Standards
  </text>
  <text x="250" y="345" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">
    ISO 9001, 20700, 27001, 42001, 21500
  </text>

  <!-- E2: Agenten Governance Agent -->
  <rect x="50" y="380" width="400" height="70" fill="#e3f2fd" stroke="#1976d2" stroke-width="3" rx="8"/>
  <text x="250" y="410" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1976d2">
    E2: Agenten Governance Agent
  </text>
  <text x="250" y="435" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">
    Monitors Agent Behaviour
  </text>

  <!-- E3-E7: Process Orchestration Agent (Box) -->
  <rect x="50" y="470" width="400" height="160" fill="#fff9e6" stroke="#f57c00" stroke-width="3" rx="8"/>
  <text x="250" y="500" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#f57c00">
    E3-E7: Process Orchestration Agent
  </text>
  <text x="70" y="530" font-family="Arial, sans-serif" font-size="13" fill="#333">• Dual-Process</text>
  <text x="70" y="550" font-family="Arial, sans-serif" font-size="13" fill="#333">• Phases</text>
  <text x="70" y="570" font-family="Arial, sans-serif" font-size="13" fill="#333">• Milestones</text>
  <text x="70" y="590" font-family="Arial, sans-serif" font-size="13" fill="#333">• Steps</text>
  <text x="70" y="610" font-family="Arial, sans-serif" font-size="13" fill="#333">• Event Design</text>

  <!-- E8-E9: Consulting Methodology Agent (Box) -->
  <rect x="50" y="650" width="400" height="90" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3" rx="8"/>
  <text x="250" y="680" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#7b1fa2">
    E8-E9: Consulting Methodology Agent
  </text>
  <text x="70" y="710" font-family="Arial, sans-serif" font-size="13" fill="#333">• Consulting methods</text>
  <text x="70" y="730" font-family="Arial, sans-serif" font-size="13" fill="#333">• Design Elements</text>

  <!-- E10-E11: Task Management & Multimodal Execution Agents (Box) -->
  <rect x="50" y="760" width="400" height="90" fill="#fce4ec" stroke="#c2185b" stroke-width="3" rx="8"/>
  <text x="250" y="785" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#c2185b">
    E10-E11: Task Management &amp;
  </text>
  <text x="250" y="805" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#c2185b">
    Multimodal Execution Agents
  </text>
  <text x="70" y="830" font-family="Arial, sans-serif" font-size="13" fill="#333">• Task Management</text>
  <text x="70" y="845" font-family="Arial, sans-serif" font-size="13" fill="#333">• Multimodal Execution</text>

  <!-- E12: Multimodal Client Interaction -->
  <rect x="50" y="870" width="400" height="160" fill="#e0f2f1" stroke="#00796b" stroke-width="3" rx="8"/>
  <text x="250" y="900" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#00796b">
    E12: Multimodal Client Interaction
  </text>
  <text x="70" y="930" font-family="Arial, sans-serif" font-size="13" fill="#333">• AURA Avatar</text>
  <text x="70" y="950" font-family="Arial, sans-serif" font-size="13" fill="#333">• FEGR and LANA Output</text>
  <text x="70" y="970" font-family="Arial, sans-serif" font-size="13" fill="#333">• Operate ZOOM</text>
  <text x="70" y="990" font-family="Arial, sans-serif" font-size="13" fill="#333">• Operate Miro</text>
  <text x="70" y="1010" font-family="Arial, sans-serif" font-size="13" fill="#333">• Receive client feedback</text>
  <text x="70" y="1025" font-family="Arial, sans-serif" font-size="13" fill="#333">• Listen and observe</text>

  <!-- Arrows between layers (vertical) -->
  <line x1="250" y1="250" x2="250" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arrowgray)"/>
  <line x1="250" y1="360" x2="250" y2="380" stroke="#333" stroke-width="2" marker-end="url(#arrowgray)"/>
  <line x1="250" y1="450" x2="250" y2="470" stroke="#333" stroke-width="2" marker-end="url(#arrowgray)"/>
  <line x1="250" y1="630" x2="250" y2="650" stroke="#333" stroke-width="2" marker-end="url(#arrowgray)"/>
  <line x1="250" y1="740" x2="250" y2="760" stroke="#333" stroke-width="2" marker-end="url(#arrowgray)"/>
  <line x1="250" y1="850" x2="250" y2="870" stroke="#333" stroke-width="2" marker-end="url(#arrowgray)"/>

  <!-- Centre: Autonomy Features -->
  <text x="800" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">
    Autonomy Features
  </text>

  <!-- ACHP -->
  <rect x="600" y="200" width="400" height="110" fill="#e8f5e9" stroke="#388e3c" stroke-width="3" rx="8"/>
  <text x="800" y="235" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#388e3c">
    ACHP
  </text>
  <text x="800" y="260" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">
    Autonomous Context-Aware Handoff Protocol
  </text>
  <text x="800" y="285" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#666">
    Automated handoffs, Context Validation
  </text>
  <text x="800" y="305" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#666">
    No context loss, used by E3-E7
  </text>

  <!-- G-EE -->
  <rect x="600" y="330" width="400" height="110" fill="#e3f2fd" stroke="#1976d2" stroke-width="3" rx="8"/>
  <text x="800" y="365" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1976d2">
    G-EE
  </text>
  <text x="800" y="390" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">
    Governance &amp; Execution Engine
  </text>
  <text x="800" y="415" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#666">
    Implemented by E2 (Agents Governance Agent)
  </text>
  <text x="800" y="435" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#666">
    Security Orchestrator, Agent monitoring
  </text>

  <!-- SABEE -->
  <rect x="600" y="460" width="400" height="110" fill="#fff9e6" stroke="#f57c00" stroke-width="3" rx="8"/>
  <text x="800" y="495" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#f57c00">
    SABEE
  </text>
  <text x="800" y="520" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">
    Sandbox Execution Engine
  </text>
  <text x="800" y="545" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#666">
    Context archiving, versioning
  </text>
  <text x="800" y="565" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#666">
    Long-term projects, used by E10-E11
  </text>

  <!-- PPLS -->
  <rect x="600" y="590" width="400" height="110" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3" rx="8"/>
  <text x="800" y="625" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#7b1fa2">
    PPLS
  </text>
  <text x="800" y="650" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">
    Privacy-Preserving Learning System
  </text>
  <text x="800" y="675" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#666">
    Anonymisation, Federated Learning
  </text>
  <text x="800" y="695" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#666">
    GDPR compliance, used by E10-E11
  </text>

  <!-- Right: Integration -->
  <text x="1400" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">
    Integration
  </text>

  <!-- ISMS -->
  <rect x="1200" y="200" width="400" height="90" fill="#ffebee" stroke="#d32f2f" stroke-width="3" rx="8"/>
  <text x="1400" y="235" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#d32f2f">
    ISMS
  </text>
  <text x="1400" y="260" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">
    Standalone system (ISO 27001)
  </text>
  <text x="1400" y="280" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#666">
    Used by E1 &amp; E2
  </text>

  <!-- ACI -->
  <rect x="1200" y="310" width="400" height="90" fill="#e8f5e9" stroke="#388e3c" stroke-width="3" rx="8"/>
  <text x="1400" y="345" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#388e3c">
    ACI
  </text>
  <text x="1400" y="370" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">
    Adaptive Consulting Intelligence
  </text>
  <text x="1400" y="390" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#666">
    PM model selection, used by E3-E7
  </text>

  <!-- FEGR & LANA -->
  <rect x="1200" y="420" width="400" height="90" fill="#e3f2fd" stroke="#1976d2" stroke-width="3" rx="8"/>
  <text x="1400" y="455" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1976d2">
    FEGR &amp; LANA
  </text>
  <text x="1400" y="480" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">
    Multimodal Analysis
  </text>
  <text x="1400" y="500" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#666">
    Visual + Language Analysis, for E12
  </text>

  <!-- AURA -->
  <rect x="1200" y="530" width="400" height="90" fill="#fff9e6" stroke="#f57c00" stroke-width="3" rx="8"/>
  <text x="1400" y="565" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#f57c00">
    AURA
  </text>
  <text x="1400" y="590" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">
    Avatar System
  </text>
  <text x="1400" y="610" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#666">
    Multimodal Avatar, used by E10-E11
  </text>

  <!-- DPO -->
  <rect x="1200" y="640" width="400" height="90" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3" rx="8"/>
  <text x="1400" y="675" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#7b1fa2">
    DPO
  </text>
  <text x="1400" y="700" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">
    Dual-Process Orchestration
  </text>
  <text x="1400" y="720" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#666">
    Core component in E3-E7
  </text>

  <!-- Connection arrows -->
  
  <!-- E1 → ISMS (down, horizontal, up) -->
  <line x1="450" y1="315" x2="480" y2="315" stroke="#388e3c" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="480" y1="315" x2="480" y2="1100" stroke="#388e3c" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="480" y1="1100" x2="1150" y2="1100" stroke="#388e3c" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="1150" y1="1100" x2="1150" y2="245" stroke="#388e3c" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="1150" y1="245" x2="1200" y2="245" stroke="#388e3c" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowgreen)"/>
  <text x="800" y="1090" font-family="Arial, sans-serif" font-size="12" fill="#388e3c">E1 → ISMS</text>

  <!-- E2 → G-EE (directly right) -->
  <line x1="450" y1="415" x2="600" y2="390" stroke="#1976d2" stroke-width="2" marker-end="url(#arrowblue)"/>
  <text x="500" y="395" font-family="Arial, sans-serif" font-size="12" fill="#1976d2">Implementiert</text>

  <!-- E3-E7 → ACHP (directly right, upward) -->
  <line x1="450" y1="530" x2="600" y2="270" stroke="#388e3c" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowgreen)"/>
  <text x="500" y="390" font-family="Arial, sans-serif" font-size="12" fill="#388e3c">Nutzt ACHP</text>

  <!-- E3-E7 → ACI (down, horizontal, up) -->
  <line x1="450" y1="550" x2="500" y2="550" stroke="#f57c00" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="500" y1="550" x2="500" y2="1120" stroke="#f57c00" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="500" y1="1120" x2="1170" y2="1120" stroke="#f57c00" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="1170" y1="1120" x2="1170" y2="355" stroke="#f57c00" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="1170" y1="355" x2="1200" y2="355" stroke="#f57c00" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arroworange)"/>
  <text x="800" y="1110" font-family="Arial, sans-serif" font-size="12" fill="#f57c00">E3-E7 → ACI</text>

  <!-- E3-E7 → DPO (down, horizontal, up) -->
  <line x1="450" y1="590" x2="520" y2="590" stroke="#7b1fa2" stroke-width="2"/>
  <line x1="520" y1="590" x2="520" y2="1140" stroke="#7b1fa2" stroke-width="2"/>
  <line x1="520" y1="1140" x2="1190" y2="1140" stroke="#7b1fa2" stroke-width="2"/>
  <line x1="1190" y1="1140" x2="1190" y2="685" stroke="#7b1fa2" stroke-width="2"/>
  <line x1="1190" y1="685" x2="1200" y2="685" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrowpurple)"/>
  <text x="800" y="1130" font-family="Arial, sans-serif" font-size="12" fill="#7b1fa2">E3-E7 → DPO (integriert)</text>

  <!-- E10-E11 → SABEE (directly diagonal) -->
  <line x1="450" y1="805" x2="600" y2="515" stroke="#f57c00" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arroworange)"/>
  <text x="500" y="650" font-family="Arial, sans-serif" font-size="12" fill="#f57c00">Nutzt SABEE</text>

  <!-- E10-E11 → PPLS (directly left, upward) -->
  <line x1="450" y1="815" x2="600" y2="670" stroke="#7b1fa2" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowpurple)"/>
  <text x="500" y="730" font-family="Arial, sans-serif" font-size="12" fill="#7b1fa2">Nutzt PPLS</text>

  <!-- E10-E11 → AURA (down, horizontal, up) -->
  <line x1="450" y1="825" x2="560" y2="825" stroke="#c2185b" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="560" y1="825" x2="560" y2="1180" stroke="#c2185b" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="560" y1="1180" x2="1110" y2="1180" stroke="#c2185b" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="1110" y1="1180" x2="1110" y2="575" stroke="#c2185b" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="1110" y1="575" x2="1200" y2="575" stroke="#c2185b" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowpink)"/>
  <text x="800" y="1170" font-family="Arial, sans-serif" font-size="12" fill="#c2185b">E10-E11 → AURA</text>

  <!-- E12 → FEGR &amp; LANA (down, horizontal, up) -->
  <line x1="450" y1="950" x2="580" y2="950" stroke="#1976d2" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="580" y1="950" x2="580" y2="1200" stroke="#1976d2" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="580" y1="1200" x2="1090" y2="1200" stroke="#1976d2" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="1090" y1="1200" x2="1090" y2="465" stroke="#1976d2" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="1090" y1="465" x2="1200" y2="465" stroke="#1976d2" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowblue)"/>
  <text x="800" y="1190" font-family="Arial, sans-serif" font-size="12" fill="#1976d2">E12 → FEGR &amp; LANA</text>

  <!-- Legend -->
  <rect x="50" y="1350" width="1750" height="180" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="8"/>
  <text x="925" y="1385" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">
    Legend
  </text>
  
  <line x1="100" y1="1420" x2="160" y2="1420" stroke="#333" stroke-width="2" marker-end="url(#arrowgray)"/>
  <text x="170" y="1425" font-family="Arial, sans-serif" font-size="14" fill="#333">
    Hierarchy Flow (E0 → E1 → ... → E12)
  </text>

  <line x1="500" y1="1420" x2="560" y2="1420" stroke="#388e3c" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowgreen)"/>
  <text x="570" y="1425" font-family="Arial, sans-serif" font-size="14" fill="#333">
    Uses System/Component
  </text>

  <line x1="900" y1="1420" x2="960" y2="1420" stroke="#f57c00" stroke-width="2" marker-end="url(#arroworange)"/>
  <text x="970" y="1425" font-family="Arial, sans-serif" font-size="14" fill="#333">
    Integrates Component
  </text>

  <text x="100" y="1460" font-family="Arial, sans-serif" font-size="14" fill="#333">
    <tspan font-weight="bold">E0: Human Governance</tspan> = Human as touchpoint (not agent)
  </text>
  <text x="100" y="1485" font-family="Arial, sans-serif" font-size="14" fill="#333">
    <tspan font-weight="bold">E1-E11:</tspan> Agents (System &amp; Processes Governance, Agents Governance, Process Orchestration, Consulting Methodology, Task Management &amp; Multimodal Execution)
  </text>
  <text x="100" y="1510" font-family="Arial, sans-serif" font-size="14" fill="#333">
    <tspan font-weight="bold">E12:</tspan> Multimodal Client Interaction (AURA Avatar, FEGR &amp; LANA, ZOOM, Miro, Client feedback, Listening &amp; Observing)
  </text>
</svg>
